# haunted-desktop default config — copy to ~/.config/haunted-desktop/config.toml
# Art direction: subtle and natural (soft silhouettes, not cartoon/flashy),
# but clearly haunted — visible enough to notice. Glowing eyes included.
# Sound off. Not optimized for ultra-quiet meeting backdrops.

[spawn]
# Noticeable but not a screensaver loop
interval_min_s = 60
interval_max_s = 240
double_chance = 0.06

[creature]
# Soft forms + dim glowing eyes
set = ["ghost", "bat", "cat", "spider", "shadow", "eyes"]
# Visible haunt without going opaque/flashy
opacity = 0.75
# Drift speed (screen-widths per second)
speed_min = 0.05
speed_max = 0.14
# Creature size as fraction of screen height
scale_min = 0.10
scale_max = 0.20
# The head-shaped "shadow" is life-size: ~23 cm tall is ~0.68 of a 34 cm-tall screen.
# Lower these if it's too big for your monitor.
shadow_scale_min = 0.65
shadow_scale_max = 0.70
lifetime_min_s = 7
lifetime_max_s = 16

[display]
# Prefer X11 for reliable click-through. Wayland may ignore input shaping.
backend = "auto"  # auto | x11 | wayland
always_on_top = true

[sound]
enabled = false

[daemon]
pid_file = "~/.cache/haunted-desktop/haunted-desktop.pid"
log_file = "~/.cache/haunted-desktop/haunted-desktop.log"
