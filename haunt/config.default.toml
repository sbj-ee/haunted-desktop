# haunted-desktop default config — copy to ~/.config/haunted-desktop/config.toml
# Art direction: subtle, professional-behind-you-on-camera. Soft silhouettes,
# low opacity, slow drift. Sparse enough to miss if you aren't looking.
# Not cartoonish, not jump-scare, no loud FX.

[spawn]
# Rare appearances — quiet easter egg, not a screensaver loop
interval_min_s = 180
interval_max_s = 720
# Almost never two at once
double_chance = 0.02

[creature]
# Soft shadow forms + rare dim glowing eyes (no loud sprites)
set = ["ghost", "bat", "cat", "spider", "shadow", "eyes"]
# Low opacity — trick of the light
opacity = 0.22
# Slow drift (screen-widths per second)
speed_min = 0.03
speed_max = 0.08
# Small — easy to miss on a meeting backdrop
scale_min = 0.06
scale_max = 0.12
# Brief presence
lifetime_min_s = 8
lifetime_max_s = 16

[display]
# Prefer X11 for reliable click-through. Wayland may ignore input shaping.
backend = "auto"  # auto | x11 | wayland
always_on_top = true

[sound]
# Always muted for meeting-safe use. Soft FX may land later — still off by default.
enabled = false

[daemon]
pid_file = "~/.cache/haunted-desktop/haunted-desktop.pid"
log_file = "~/.cache/haunted-desktop/haunted-desktop.log"
