[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-desktop"
version = "0.1.3"
description = "Subtle haunted Linux desktop overlay — soft silhouettes for Halloween (subtle haunted overlay)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stephen Johnson" }]
keywords = ["halloween", "desktop", "overlay", "x11", "gtk", "subtle"]
dependencies = []  # runtime: system python3-gi / python3-cairo / GTK3

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
haunted-desktop = "haunt.cli:main"
haunt = "haunt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["haunt*"]

[tool.setuptools.package-data]
haunt = ["config.default.toml"]
